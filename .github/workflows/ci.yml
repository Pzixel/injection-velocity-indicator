name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: KSPModdingLibs/KSPBuildTools/.github/workflows/build.yml@1.1.1
    with:
      solution-file-path: InjectionVelocityIndicator.sln
      dotnet-version: 10.x
      use-ckan: true
      dependency-identifiers: Harmony2
      artifacts: GameData/InjectionVelocityIndicator/Plugins GameData/ManeuverOrbitJumper/Plugins GameData/SimpleSplitter/Plugins LICENSE README.md README.ManeuverOrbitJumper.md README.SimpleSplitter.md CHANGELOG.md CHANGELOG.ManeuverOrbitJumper.md CHANGELOG.SimpleSplitter.md CKAN

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Run unit tests
        shell: bash
        run: |
          dotnet run --project tests/InjectionVelocityIndicator.Tests --configuration Release
          dotnet run --project tests/SimpleSplitter.Tests --configuration Release

  metadata:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate NetKAN metadata
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
          python - <<'PY'
          from pathlib import Path
          import yaml

          expected = {
              'InjectionVelocityIndicator': ((
                  '#/ckan/github/Pzixel/injection-velocity-indicator/'
                  'version_from_asset/^InjectionVelocityIndicator-'
                  '(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)\\.zip$'
              ), [{'name': 'Harmony2'}]),
              'ManeuverOrbitJumper': ((
                  '#/ckan/github/Pzixel/injection-velocity-indicator/'
                  'version_from_asset/^ManeuverOrbitJumper-'
                  '(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)\\.zip$'
              ), [{'name': 'Harmony2'}]),
              'SimpleSplitter': ((
                  '#/ckan/github/Pzixel/injection-velocity-indicator/'
                  'version_from_asset/^SimpleSplitter-'
                  '(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)\\.zip$'
              ), []),
          }

          for identifier, (expected_kref, expected_depends) in expected.items():
              path = Path('CKAN') / f'{identifier}.netkan'
              metadata = yaml.safe_load(path.read_text())
              assert metadata['identifier'] == identifier
              assert metadata['$kref'] == expected_kref
              assert metadata['$vref'] == '#/ckan/ksp-avc'
              assert metadata.get('depends', []) == expected_depends
          PY

      - name: Validate KSP-AVC template JSON
        shell: bash
        run: |
          for template in \
            GameData/InjectionVelocityIndicator/InjectionVelocityIndicator.version.versiontemplate \
            GameData/ManeuverOrbitJumper/ManeuverOrbitJumper.version.versiontemplate \
            GameData/SimpleSplitter/SimpleSplitter.version.versiontemplate; do
            sed \
              -e 's/@VERSION_MAJOR@/1/g' \
              -e 's/@VERSION_MINOR@/0/g' \
              -e 's/@VERSION_PATCH@/0/g' \
              "$template" | python -m json.tool > /dev/null
          done

      - name: Reject bundled Harmony
        shell: bash
        run: |
          if find GameData -iname '0Harmony.dll' | grep -q .; then
            echo '0Harmony.dll must be provided by the Harmony2 dependency, not bundled.' >&2
            exit 1
          fi
