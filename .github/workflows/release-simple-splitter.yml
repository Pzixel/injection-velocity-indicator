name: Release Simple Splitter

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    env:
      KSP_ROOT: /tmp/ksp
      RELEASE_STAGING: /tmp/release-simple-splitter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Validate version input
        shell: bash
        run: |
          if [[ ! '${{ inputs.version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must use MAJOR.MINOR.PATCH format.' >&2
            exit 1
          fi
          echo 'VERSION_STRING=${{ inputs.version }}' >> "$GITHUB_ENV"
          echo 'RELEASE_TAG=simple-splitter-v${{ inputs.version }}' >> "$GITHUB_ENV"

      - name: Update Simple Splitter version and changelog
        id: version
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/update-version@1.1.1
        with:
          version-string: ${{ inputs.version }}
          files: >-
            GameData/SimpleSplitter/SimpleSplitter.version.versiontemplate
            src/SimpleSplitter/Properties/AssemblyInfo.cs.versiontemplate
          changelog-input-file: CHANGELOG.SimpleSplitter.md

      - name: Commit release version
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Release Simple Splitter ${VERSION_STRING}"

      - name: Set up CKAN
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/setup-ckan@1.1.1

      - name: Install build environment
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/install-dependencies@1.1.1
        with:
          dependency-identifiers: Harmony2

      - name: Compile Simple Splitter Release
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/compile@1.1.1
        with:
          build-configuration: Release
          solution-file-path: src/SimpleSplitter/SimpleSplitter.csproj

      - name: Assemble Simple Splitter release ZIP
        id: package
        shell: bash
        run: |
          package_root="$RELEASE_STAGING/package"
          release_zip="$GITHUB_WORKSPACE/SimpleSplitter-${VERSION_STRING}.zip"
          mkdir -p "$package_root/GameData/SimpleSplitter/Plugins"
          cp GameData/SimpleSplitter/Plugins/SimpleSplitter.dll \
            "$package_root/GameData/SimpleSplitter/Plugins/"
          cp GameData/SimpleSplitter/SimpleSplitter.version \
            "$package_root/GameData/SimpleSplitter/"
          cp GameData/SimpleSplitter/LICENSE GameData/SimpleSplitter/LICENSE.MIT \
            GameData/SimpleSplitter/NOTICE.md "$package_root/GameData/SimpleSplitter/"
          cp LICENSE.SimpleSplitter "$package_root/LICENSE"
          cp LICENSE "$package_root/LICENSE.MIT"
          cp README.SimpleSplitter.md "$package_root/README.md"
          cp CHANGELOG.SimpleSplitter.md "$package_root/CHANGELOG.md"
          mkdir -p "$package_root/Source"
          git archive HEAD src/SimpleSplitter tests/SimpleSplitter.Tests \
            LICENSE LICENSE.SimpleSplitter README.SimpleSplitter.md \
            | tar -xf - -C "$package_root/Source"
          (
            cd "$package_root"
            zip -r "$release_zip" GameData Source LICENSE LICENSE.MIT README.md CHANGELOG.md
          )
          echo "artifact-zip-path=$release_zip" >> "$GITHUB_OUTPUT"

      - name: Verify Simple Splitter release contents
        shell: bash
        env:
          RELEASE_ZIP: ${{ steps.package.outputs.artifact-zip-path }}
        run: |
          unzip -Z1 "$RELEASE_ZIP" > /tmp/simple-splitter-release-files.txt
          grep -Fx 'GameData/SimpleSplitter/Plugins/SimpleSplitter.dll' \
            /tmp/simple-splitter-release-files.txt
          grep -Fx 'GameData/SimpleSplitter/SimpleSplitter.version' \
            /tmp/simple-splitter-release-files.txt
          grep -Fx 'LICENSE' /tmp/simple-splitter-release-files.txt
          grep -Fx 'LICENSE.MIT' /tmp/simple-splitter-release-files.txt
          grep -Fx 'GameData/SimpleSplitter/NOTICE.md' /tmp/simple-splitter-release-files.txt
          grep -Fx 'Source/src/SimpleSplitter/Vendor/KerbalEngineer/VesselSimulator/Simulation.cs' \
            /tmp/simple-splitter-release-files.txt
          grep -Fx 'README.md' /tmp/simple-splitter-release-files.txt
          grep -Fx 'CHANGELOG.md' /tmp/simple-splitter-release-files.txt
          if grep -iE '(^|/)0Harmony\.dll$' \
            /tmp/simple-splitter-release-files.txt; then
            echo 'Release must not bundle Harmony.' >&2
            exit 1
          fi
          if grep -qE '^GameData/(InjectionVelocityIndicator|ManeuverOrbitJumper)/' \
            /tmp/simple-splitter-release-files.txt; then
            echo 'Release must not bundle another mod.' >&2
            exit 1
          fi

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleSplitter-${{ inputs.version }}
          path: ${{ steps.package.outputs.artifact-zip-path }}
          if-no-files-found: error

      - name: Push release commit
        shell: bash
        run: git push origin HEAD:master

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ZIP: ${{ steps.package.outputs.artifact-zip-path }}
          RELEASE_NOTES: ${{ steps.version.outputs.release-notes-output-file }}
        run: >-
          gh release create "$RELEASE_TAG" "$RELEASE_ZIP"
          --target master
          --title "Simple Splitter ${VERSION_STRING}"
          --notes-file "$RELEASE_NOTES"
