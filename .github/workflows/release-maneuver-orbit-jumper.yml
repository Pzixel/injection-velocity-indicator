name: Release Maneuver Orbit Jumper

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    env:
      KSP_ROOT: /tmp/ksp
      RELEASE_STAGING: /tmp/release-maneuver-orbit-jumper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Validate version input
        shell: bash
        run: |
          if [[ ! '${{ inputs.version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must use MAJOR.MINOR.PATCH format.' >&2
            exit 1
          fi
          echo 'VERSION_STRING=${{ inputs.version }}' >> "$GITHUB_ENV"
          echo 'RELEASE_TAG=maneuver-orbit-jumper-v${{ inputs.version }}' >> "$GITHUB_ENV"

      - name: Update Maneuver Orbit Jumper version and changelog
        id: version
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/update-version@1.1.1
        with:
          version-string: ${{ inputs.version }}
          files: >-
            GameData/ManeuverOrbitJumper/ManeuverOrbitJumper.version.versiontemplate
            src/ManeuverOrbitJumper/Properties/AssemblyInfo.cs.versiontemplate
          changelog-input-file: CHANGELOG.ManeuverOrbitJumper.md

      - name: Commit release version
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Release Maneuver Orbit Jumper ${VERSION_STRING}"

      - name: Set up CKAN
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/setup-ckan@1.1.1

      - name: Install build-only Harmony2 dependency
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/install-dependencies@1.1.1
        with:
          dependency-identifiers: Harmony2

      - name: Compile Maneuver Orbit Jumper Release
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/compile@1.1.1
        with:
          build-configuration: Release
          solution-file-path: src/ManeuverOrbitJumper/ManeuverOrbitJumper.csproj

      - name: Assemble Maneuver Orbit Jumper release ZIP
        id: package
        shell: bash
        run: |
          package_root="$RELEASE_STAGING/package"
          release_zip="$GITHUB_WORKSPACE/ManeuverOrbitJumper-${VERSION_STRING}.zip"
          mkdir -p "$package_root/GameData/ManeuverOrbitJumper/Plugins"
          cp GameData/ManeuverOrbitJumper/Plugins/ManeuverOrbitJumper.dll \
            "$package_root/GameData/ManeuverOrbitJumper/Plugins/"
          cp GameData/ManeuverOrbitJumper/ManeuverOrbitJumper.version \
            "$package_root/GameData/ManeuverOrbitJumper/"
          cp LICENSE "$package_root/"
          cp README.ManeuverOrbitJumper.md "$package_root/README.md"
          cp CHANGELOG.ManeuverOrbitJumper.md "$package_root/CHANGELOG.md"
          (
            cd "$package_root"
            zip -r "$release_zip" GameData LICENSE README.md CHANGELOG.md
          )
          echo "artifact-zip-path=$release_zip" >> "$GITHUB_OUTPUT"

      - name: Verify Maneuver Orbit Jumper release contents
        shell: bash
        env:
          RELEASE_ZIP: ${{ steps.package.outputs.artifact-zip-path }}
        run: |
          unzip -Z1 "$RELEASE_ZIP" > /tmp/maneuver-orbit-jumper-release-files.txt
          grep -Fx 'GameData/ManeuverOrbitJumper/Plugins/ManeuverOrbitJumper.dll' \
            /tmp/maneuver-orbit-jumper-release-files.txt
          grep -Fx 'GameData/ManeuverOrbitJumper/ManeuverOrbitJumper.version' \
            /tmp/maneuver-orbit-jumper-release-files.txt
          grep -Fx 'LICENSE' /tmp/maneuver-orbit-jumper-release-files.txt
          grep -Fx 'README.md' /tmp/maneuver-orbit-jumper-release-files.txt
          grep -Fx 'CHANGELOG.md' /tmp/maneuver-orbit-jumper-release-files.txt
          if grep -iE '(^|/)0Harmony\.dll$' \
            /tmp/maneuver-orbit-jumper-release-files.txt; then
            echo 'Release must not bundle Harmony.' >&2
            exit 1
          fi
          if grep -q '^GameData/InjectionVelocityIndicator/' \
            /tmp/maneuver-orbit-jumper-release-files.txt; then
            echo 'Release must not bundle Injection Velocity Indicator.' >&2
            exit 1
          fi

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManeuverOrbitJumper-${{ inputs.version }}
          path: ${{ steps.package.outputs.artifact-zip-path }}
          if-no-files-found: error

      - name: Push release commit
        shell: bash
        run: git push origin HEAD:master

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ZIP: ${{ steps.package.outputs.artifact-zip-path }}
          RELEASE_NOTES: ${{ steps.version.outputs.release-notes-output-file }}
        run: >-
          gh release create "$RELEASE_TAG" "$RELEASE_ZIP"
          --target master
          --title "Maneuver Orbit Jumper ${VERSION_STRING}"
          --notes-file "$RELEASE_NOTES"
